{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/site.webmanifest">
<meta name="theme-color" content="#2a7f8f">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<style>
.lang-zh { display: none; }
html.zh .lang-en { display: none !important; }
html.zh .lang-zh { display: inline !important; }
html { scroll-behavior: smooth; }
a { color: #2a7f8f; }
a:hover, a:focus { color: #17565f; }
::selection { background: #cfe8ec; }
.coming-soon {
  color: #5f7078;
  font-style: italic;
  background: #f4f9fa;
  border-left: 3px solid #bcd9de;
  border-radius: 0 4px 4px 0;
  padding: 0.4rem 0.9rem;
  margin: 1rem 0;
}
</style>

<!-- end custom head snippets -->
